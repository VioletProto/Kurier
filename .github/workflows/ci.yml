name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/api
          - services/worker
          - services/local-agent
          - infra/spikes/sst-viability/service
          - infra/spikes/sst-db-viability/service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: ${{ matrix.service }}/go.mod
      - run: go test ./...
      - run: go vet ./...

  ownership-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: services/api/go.sum
      - run: docker compose -f compose.dynamodb.yml up -d
      - run: go test -race -tags=integration -count=1 ./...
        working-directory: services/api
        env:
          KURIER_DYNAMODB_TEST_ENDPOINT: http://127.0.0.1:8000
      - if: always()
        run: docker compose -f compose.dynamodb.yml down
